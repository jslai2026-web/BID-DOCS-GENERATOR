<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Bid Document Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net/npm/; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'">
<style>
:root{--navy:#14284b;--ink:#2b2f36;--gold:#d99a2b;--bg:#f3f4f7;--card:#fff;--line:#d8dce3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#e6e8ec;--bg:#14161a;--card:#1d2025;--line:#363b44}}
*{box-sizing:border-box}html,body{margin:0;font:14px system-ui,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}
#intro{position:fixed;inset:0;background:var(--navy);z-index:9;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}
#intro .l{font:800 clamp(90px,22vw,200px)/1 Georgia,serif;color:#fff;display:flex;animation:slide 2.4s ease-in-out forwards}
#intro .l span{display:inline-block}#intro .l span:first-child{animation:splitL 2.4s ease-in-out forwards}#intro .l span:last-child{color:var(--gold);animation:splitR 2.4s ease-in-out forwards}
#intro h2{color:#fff;letter-spacing:.35em;font-weight:500;opacity:0;animation:fade 1s 1.4s forwards;text-align:center}
#intro button{margin-top:20px}
@keyframes slide{0%{transform:translateX(-110vw)}60%{transform:translateX(0)}100%{transform:translateX(0)}}
@keyframes splitL{0%,55%{transform:translateX(0) skewX(-20deg);filter:blur(6px)}70%{transform:translateX(-30px)}100%{transform:translateX(-8px) skewX(0);filter:none}}
@keyframes splitR{0%,55%{transform:translateX(0) skewX(20deg);filter:blur(6px)}70%{transform:translateX(30px)}100%{transform:translateX(8px) skewX(0);filter:none}}
@keyframes fade{to{opacity:1}}
#app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
nav{background:var(--navy);color:#fff;padding:14px 0}nav .b{font:800 22px Georgia;padding:0 16px 14px}nav .b b{color:var(--gold)}
nav a{display:block;padding:10px 16px;color:#cfd6e6;cursor:pointer;border-left:3px solid transparent}nav a.on,nav a:hover{background:#1d3563;color:#fff;border-color:var(--gold)}
main{padding:18px;min-width:0}h1{margin:0 0 12px;font-size:20px;color:var(--navy)}@media (prefers-color-scheme:dark){h1{color:#fff}}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
label{display:block;font-size:12px;margin-bottom:8px}input,select,textarea{width:100%;padding:7px;border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--ink);font:inherit}
button{background:var(--navy);color:#fff;border:0;padding:8px 12px;border-radius:5px;cursor:pointer;font:inherit;margin:2px}button.g{background:var(--gold);color:#1a1a1a}button.s{background:#7a8190}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--line);padding:5px;text-align:left}th{background:var(--navy);color:#fff}
.sec{border:1px solid var(--line);border-radius:6px;margin-bottom:8px;background:var(--card)}.sec .h{display:flex;gap:6px;align-items:center;padding:6px;background:var(--bg)}.sec .h input[type=text]{flex:1}
.ed{min-height:70px;padding:8px;outline:0}.paper{background:#fff;color:#000;padding:30px;max-width:760px;margin:auto;box-shadow:0 2px 10px #0003;font-family:Georgia,serif}
.paper h2{border-bottom:2px solid var(--gold);padding-bottom:3px}.paper table td{border-color:#999}.note{font-size:12px;opacity:.75}
@media(max-width:720px){#app{grid-template-columns:1fr}nav{display:flex;overflow-x:auto;padding:0}nav .b{display:none}nav a{white-space:nowrap;border-left:0}}
.mb{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}.mc{max-width:420px;width:100%;margin:0}.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:6px;z-index:30;max-width:90vw}
</style></head><body>
<div id="intro"><div class="l"><span>J</span><span>L</span></div><h2>BID DOCUMENT GENERATOR</h2><button class="g" onclick="skip()">Skip Intro</button></div>
<div id="app"><nav id="nav"></nav><main id="main"></main></div><div id="dlg"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function clean(h){const d=new DOMParser().parseFromString(h,'text/html');d.querySelectorAll('script,style,iframe,object,embed,link,meta,img,form').forEach(e=>e.remove());d.querySelectorAll('*').forEach(e=>[...e.attributes].forEach(a=>{if(/^on/i.test(a.name)||/javascript:/i.test(a.value)||a.name==='href'||a.name==='src')e.removeAttribute(a.name)}));return d.body.innerHTML}
const skip=()=>{const i=$('#intro');if(i)i.remove()};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)};window.alert=toast;
const dlg=(msg,inp,def)=>new Promise(r=>{const d=$('#dlg');d.innerHTML=`<div class="mb"><div class="mc card"><p>${esc(msg)}</p>${inp?`<input id="dv" value="${esc(def||'')}">`:''}<button class="g" id="ok">OK</button><button class="s" id="no">Cancel</button></div></div>`;const x=v=>{d.innerHTML='';r(v)};$('#ok').onclick=()=>x(inp?$('#dv').value:true);$('#no').onclick=()=>x(inp?null:false);if(inp){$('#dv').focus();$('#dv').onkeydown=e=>{if(e.key==='Enter')$('#ok').click()}}});
setTimeout(skip,4200);
// ---- storage (IndexedDB) ----
let db;const idb=new Promise(r=>{const q=indexedDB.open('bidgen',1);q.onupgradeneeded=()=>q.result.createObjectStore('p',{keyPath:'id'});q.onsuccess=()=>{db=q.result;r()}});
const tx=(m,f)=>new Promise(r=>{const t=db.transaction('p',m);const o=f(t.objectStore('p'));t.oncomplete=()=>r(o&&o.result)});
const allP=()=>tx('readonly',s=>s.getAll()),putP=p=>{p.modified=new Date().toISOString();return tx('readwrite',s=>s.put(p))},delP=id=>tx('readwrite',s=>s.delete(id));
const DEF=['Cover Page','Invitation to Bid','Instructions to Bidders','Project Information','Scope of Work','General Conditions','Special Provisions','Technical Specifications','Construction Schedule','Health and Safety Requirements','Environmental Requirements','Quality Assurance Requirements','Bid Submission Forms','Agreement Form','Appendices'];
const FIELDS=[['name','Project Name'],['number','Project Number'],['location','Location'],['owner','Owner / Municipality'],['dept','Department'],['pm','Project Manager'],['prep','Prepared By'],['date','Date Prepared','date'],['close','Closing Date','date'],['time','Closing Time','time'],['contract','Contract Number'],['type','Project Type']];
const TYPES=['Roads and Highways','Watermain','Wastewater and Sanitary Sewer','Stormwater Management','Transportation','Traffic Signals','Sidewalks and Multi-Use Trails','Buildings','Parks and Recreation','General Infrastructure','Other'];
const newP=()=>({id:'p'+Date.now(),status:'Draft',info:{type:TYPES[0],date:new Date().toISOString().slice(0,10)},secs:DEF.map(t=>({t,on:true,h:''})),rows:[{n:'1',d:'',u:'LS',q:1,p:0}],tax:5,cont:0,paper:'letter',hdr:'',ftr:'Page {n}'});
let P=null,view='dash',lib=JSON.parse(localStorage.getItem('bidlib')||'[]');
const TABS=[['dash','Dashboard / Projects'],['info','Project Info'],['tpl','Import Samples'],['sec','Sections & Editor'],['price','Pricing Schedule'],['prev','Preview'],['exp','Export & Backup'],['help','Privacy & Help']];
$('#nav').innerHTML='<div class="b"><b>J</b>L</div>'+TABS.map(t=>`<a data-v="${t[0]}">${t[1]}</a>`).join('');
$('#nav').onclick=e=>{const v=e.target.dataset.v;if(v){view=v;render()}};
let saveTm;const save=()=>{clearTimeout(saveTm);saveTm=setTimeout(async()=>{if(P){await putP(P);const s=$('#saved');if(s)s.textContent='Saved '+new Date().toLocaleTimeString()}},400)};
const money=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(n||0);
const calc=()=>{const sub=P.rows.reduce((a,r)=>a+(+r.q||0)*(+r.p||0),0),c=+P.cont||0,tx=(sub+c)*(+P.tax||0)/100;return{sub,c,tx,tot:sub+c+tx}};
async function render(){await idb;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===view));const m=$('#main');
if(view==='dash'){const ps=await allP();m.innerHTML=`<h1>Dashboard</h1><div class="grid"><div class="card"><b>${ps.length}</b><br>Total Projects</div><div class="card"><b>${ps.filter(p=>p.status==='Draft').length}</b><br>Drafts</div><div class="card"><b>${ps.filter(p=>p.status==='Complete').length}</b><br>Completed</div><div class="card"><b>${lib.length}</b><br>Saved Templates</div></div>
<div class="card"><button class="g" onclick="mk()">+ New Bid Document</button><div class="scroll"><table><tr><th>No.</th><th>Name</th><th>Type</th><th>Modified</th><th>Status</th><th>Actions</th></tr>${ps.sort((a,b)=>(b.modified||'')>(a.modified||'')?1:-1).map(p=>`<tr><td>${esc(p.info.number)}</td><td>${esc(p.info.name)}</td><td>${esc(p.info.type)}</td><td>${p.modified?new Date(p.modified).toLocaleString():''}</td><td>${p.status}</td><td><button onclick="op('${p.id}')">Open</button><button class="s" onclick="dup('${p.id}')">Duplicate</button><button class="s" onclick="ren('${p.id}')">Rename</button><button class="s" onclick="stat('${p.id}')">Toggle status</button><button class="g" onclick="bkId('${p.id}')">💾 Save to Desktop</button><button class="s" onclick="del('${p.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan=6>No projects yet.</td></tr>'}</table></div></div>`;return}
if(!P){m.innerHTML='<h1>No project open</h1><p>Open or create a project from the Dashboard.</p>';return}
if(view==='info'){m.innerHTML=`<h1>Project Info</h1><div class="card grid">${FIELDS.map(f=>f[0]==='type'?`<label>${f[1]}<select data-k="type">${TYPES.map(t=>`<option${P.info.type===t?' selected':''}>${esc(t)}</option>`).join('')}${P.info.type&&!TYPES.includes(P.info.type)?`<option selected>${esc(P.info.type)}</option>`:''}</select><button class="s" onclick="ct()">Custom category</button></label>`:`<label>${f[1]}<input type="${f[2]||'text'}" data-k="${f[0]}" value="${esc(P.info[f[0]])}"></label>`).join('')}</div><div class="card"><label>Description / Scope<textarea rows="4" data-k="desc">${esc(P.info.desc)}</textarea></label></div><p class="note" id="saved">Autosaves locally.</p>`;
m.querySelectorAll('[data-k]').forEach(i=>i.oninput=()=>{P.info[i.dataset.k]=i.value;save()});return}
if(view==='tpl'){m.innerHTML=`<h1>Import Sample Documents</h1><div class="card"><input type="file" id="f" accept=".docx,.txt,.rtf" multiple><p class="note">DOCX, TXT and RTF are read locally in your browser; nothing is uploaded and the original file is never modified. PDF/OCR import is not included in this version.</p><div id="imp"></div></div><div class="card"><b>Saved templates</b><div id="lib">${lib.map((t,i)=>`<div>${esc(t.name)} (${t.secs.length} sections) <button onclick="useT(${i})">Add to project</button><button class="s" onclick="lib.splice(${i},1);sl();render()">Delete</button></div>`).join('')||'None yet.'}</div></div>`;$('#f').onchange=importF;return}
if(view==='sec'){m.innerHTML=`<h1>Sections & Editor</h1><div class="card"><button onclick="document.execCommand('bold')">B</button><button onclick="document.execCommand('italic')"><i>I</i></button><button onclick="document.execCommand('underline')"><u>U</u></button><button onclick="document.execCommand('insertUnorderedList')">• List</button><button onclick="document.execCommand('insertOrderedList')">1. List</button><button onclick="document.execCommand('undo')">Undo</button><button onclick="document.execCommand('redo')">Redo</button><button class="g" onclick="addS()">+ Section</button><button class="s" onclick="saveT()">Save as template</button><label style="margin-top:6px">Find / replace<span style="display:flex;gap:4px"><input id="fi" placeholder="find"><input id="ri" placeholder="replace"><button onclick="fr()">Replace all</button></span></label></div>
${P.secs.map((s,i)=>`<div class="sec"><div class="h"><input type="checkbox" ${s.on?'checked':''} onchange="P.secs[${i}].on=this.checked;save()" title="Include"><input type="text" value="${esc(s.t)}" oninput="P.secs[${i}].t=this.value;save()"><button class="s" onclick="mv(${i},-1)">↑</button><button class="s" onclick="mv(${i},1)">↓</button><button class="s" onclick="P.secs.splice(${i+1},0,{...P.secs[${i}],t:P.secs[${i}].t+' (copy)'});save();render()">Dup</button><button class="s" onclick="P.secs.splice(${i},1);save();render()">✕</button></div><div class="ed" contenteditable oninput="P.secs[${i}].h=clean(this.innerHTML);save()">${clean(s.h||'')}</div></div>`).join('')}<p class="note" id="saved">Autosaves locally.</p>`;return}
if(view==='price'){const c=calc();m.innerHTML=`<h1>Pricing Schedule</h1><div class="card scroll"><table><tr><th>Item</th><th>Description</th><th>Unit</th><th>Est. Qty</th><th>Unit Price</th><th>Extended</th><th></th></tr>${P.rows.map((r,i)=>`<tr><td><input value="${esc(r.n)}" oninput="P.rows[${i}].n=this.value;save()"></td><td><input value="${esc(r.d)}" oninput="P.rows[${i}].d=this.value;save()"></td><td><input value="${esc(r.u)}" oninput="P.rows[${i}].u=this.value;save()"></td><td><input type="number" value="${r.q}" oninput="P.rows[${i}].q=this.value;upd()"></td><td><input type="number" step="0.01" value="${r.p}" oninput="P.rows[${i}].p=this.value;upd()"></td><td id="x${i}">${money(r.q*r.p)}</td><td><button class="s" onclick="P.rows.splice(${i},1);save();render()">✕</button></td></tr>`).join('')}</table><button onclick="P.rows.push({n:String(P.rows.length+1),d:'',u:'',q:0,p:0});save();render()">+ Row</button></div><div class="card grid"><label>Contingency allowance ($)<input type="number" value="${P.cont}" oninput="P.cont=this.value;upd()"></label><label>Tax %<input type="number" value="${P.tax}" oninput="P.tax=this.value;upd()"></label><div id="tot"></div></div><p class="note" id="saved">Autosaves locally.</p>`;upd();return}
if(view==='prev'){m.innerHTML=`<h1>Preview</h1><div class="card"><label>Paper<select onchange="P.paper=this.value;save()"><option value="letter"${P.paper=='letter'?' selected':''}>US Letter</option><option value="a4"${P.paper=='a4'?' selected':''}>A4</option></select></label><label>Header<input value="${esc(P.hdr)}" oninput="P.hdr=this.value;save()"></label><label>Footer ({n} = page number)<input value="${esc(P.ftr)}" oninput="P.ftr=this.value;save()"></label></div><div class="paper">${docHTML()}</div>`;return}
if(view==='exp'){m.innerHTML=`<h1>Export & Backup</h1><div class="card"><button class="g" onclick="expDocx()">Export Word (.docx)</button><button class="g" onclick="expPdf()">Export PDF</button><button onclick="expPrice()">Pricing schedule only (PDF)</button><p class="note">Exports include the sections ticked "include" in the editor, in their current order. Everything is generated in your browser.</p></div><div class="card"><button class="g" onclick="bk()">💾 Save project to Desktop (.json)</button><label>Restore backup<input type="file" accept=".json" onchange="rs(this.files[0])"></label></div>`;return}
if(view==='help'){m.innerHTML=`<h1>Privacy & Help</h1><div class="card"><p>No backend, no analytics, no uploads. Projects live in this browser's IndexedDB. A restrictive Content Security Policy blocks network calls from the page. Only the document-library scripts load from public CDNs when the app opens.</p><p><b>Warning:</b> clearing browser data, private browsing, or switching browser/device can make projects unavailable. Download backups regularly. Browser storage is <b>not encrypted</b>; it is only as secure as your computer. No application-lock feature is included, and none is faked.</p><p>Each person who opens this app has their own separate storage; sharing the app never shares projects.</p></div>`}}
function upd(){const c=calc();P.rows.forEach((r,i)=>{const e=$('#x'+i);if(e)e.textContent=money(r.q*r.p)});$('#tot').innerHTML=`Subtotal: ${money(c.sub)}<br>Contingency: ${money(c.c)}<br>Tax: ${money(c.tx)}<br><b>Total Bid Price: ${money(c.tot)}</b>`;save()}
const mk=()=>{P=newP();putP(P);view='info';render()};
const op=async id=>{P=(await allP()).find(p=>p.id===id);view='info';render()};
const dup=async id=>{const p=JSON.parse(JSON.stringify((await allP()).find(p=>p.id===id)));p.id='p'+Date.now();p.info.name=(p.info.name||'')+' (copy)';await putP(p);render()};
const ren=async id=>{const p=(await allP()).find(p=>p.id===id),n=await dlg('Rename project',1,p.info.name);if(n){p.info.name=n;await putP(p);render()}};
const stat=async id=>{const p=(await allP()).find(p=>p.id===id);p.status=p.status==='Draft'?'Complete':'Draft';await putP(p);render()};
const del=async id=>{if(await dlg('Delete this project permanently? Save a copy to your desktop first if unsure.')){await delP(id);if(P&&P.id===id)P=null;render()}};
const ct=async()=>{const n=await dlg('Custom category name',1,'');if(n){P.info.type=n;save();render()}};
const addS=()=>{P.secs.push({t:'New Section',on:true,h:''});save();render()};
const mv=(i,d)=>{const j=i+d;if(j<0||j>=P.secs.length)return;[P.secs[i],P.secs[j]]=[P.secs[j],P.secs[i]];save();render()};
const sl=()=>localStorage.setItem('bidlib',JSON.stringify(lib));
const saveT=async()=>{const n=await dlg('Template name',1,'');if(n){lib.push({name:n,secs:P.secs.map(s=>({t:s.t,h:s.h,on:true}))});sl();alert('Template saved in this browser.')}};
const useT=i=>{P.secs.push(...JSON.parse(JSON.stringify(lib[i].secs)));save();view='sec';render()};
const fr=()=>{const a=$('#fi').value,b=$('#ri').value;if(!a)return;P.secs.forEach(s=>{s.t=s.t.split(a).join(b);s.h=s.h.split(a).join(b)});save();render()};
let pend=[];
async function importF(e){const box=$('#imp');pend=[];for(const f of e.target.files){if(f.size>25e6){alert(f.name+': over 25 MB');continue}const ext=f.name.split('.').pop().toLowerCase();let html='';try{if(ext==='docx'){html=clean((await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()})).value)}else if(ext==='txt'){html=(await f.text()).split(/\n/).map(l=>/^(\d+(\.\d+)*[.)]?\s+|[A-Z][A-Z \-&,/]{6,}$)/.test(l.trim())&&l.length<90?'<h2>'+esc(l.trim())+'</h2>':'<p>'+esc(l)+'</p>').join('')}else if(ext==='rtf'){html=(await f.text()).replace(/\\par[d]?/g,'\n').replace(/\{\\[^{}]*\}/g,'').replace(/\\[a-z]+-?\d* ?/g,'').replace(/[{}]/g,'').split(/\n/).map(l=>'<p>'+esc(l)+'</p>').join('')}else{alert(f.name+': unsupported type (PDF import not included in this version)');continue}}catch(x){alert(f.name+': could not be read');continue}
const d=document.createElement('div');d.innerHTML=html;let cur={t:f.name.replace(/\.\w+$/,'')+' (intro)',h:''};const out=[];[...d.childNodes].forEach(n=>{if(/^H[1-3]$/.test(n.nodeName)){out.push(cur);cur={t:n.textContent.trim().slice(0,100),h:''}}else cur.h+=n.outerHTML||''});out.push(cur);pend.push(...out.filter(s=>s.h||s.t))}
box.innerHTML='<p>Select sections to add:</p>'+pend.map((s,i)=>`<label><input type="checkbox" style="width:auto" checked data-i="${i}"> ${esc(s.t)}</label>`).join('')+'<button class="g" onclick="addImp()">Add selected to project</button>'}
const addImp=()=>{document.querySelectorAll('#imp [data-i]:checked').forEach(c=>P.secs.push({...pend[c.dataset.i],on:true}));save();view='sec';render()};
function docHTML(){const i=P.info,n=[];let h=`<div style="text-align:center;padding:60px 0"><h1 style="color:#14284b">${esc(i.name||'Untitled Project')}</h1><p>Project No. ${esc(i.number)}<br>Contract ${esc(i.contract)}<br>${esc(i.owner)} · ${esc(i.dept)}</p><p>Closing: ${esc(i.close)} ${esc(i.time)}</p><p>Prepared by ${esc(i.prep)}</p></div><h2>Table of Contents</h2>`;const on=P.secs.filter(s=>s.on&&s.t!=='Cover Page');h+=on.map((s,k)=>`<div>${k+1}. ${esc(s.t)}</div>`).join('');h+=on.map((s,k)=>`<h2>${k+1}. ${esc(s.t)}</h2>${clean(s.h||'')}`).join('');const c=calc();h+=`<h2>Schedule of Quantities</h2><table><tr><th>Item</th><th>Description</th><th>Unit</th><th>Qty</th><th>Unit Price</th><th>Extended</th></tr>${P.rows.map(r=>`<tr><td>${esc(r.n)}</td><td>${esc(r.d)}</td><td>${esc(r.u)}</td><td>${r.q}</td><td>${money(r.p)}</td><td>${money(r.q*r.p)}</td></tr>`).join('')}<tr><td colspan=5>Subtotal</td><td>${money(c.sub)}</td></tr><tr><td colspan=5>Contingency</td><td>${money(c.c)}</td></tr><tr><td colspan=5>Tax (${P.tax}%)</td><td>${money(c.tx)}</td></tr><tr><td colspan=5><b>Total Bid Price</b></td><td><b>${money(c.tot)}</b></td></tr></table>`;return h}
const fname=e=>((P.info.number||'bid')+'-'+(P.info.name||'document')).replace(/[^\w\-]+/g,'_')+e;
async function dl(blob,n){if(window.showSaveFilePicker){try{const h=await showSaveFilePicker({suggestedName:n,startIn:'desktop'});const w=await h.createWritable();await w.write(blob);await w.close();toast('Saved '+n);return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
